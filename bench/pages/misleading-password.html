<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Bench - Misleading Labels Obscuring Credentials</title>
  <style>
    body { font-family: system-ui, sans-serif; padding: 24px; background: #fafafa; }
    .form-container { max-width: 480px; background: white; border: 1px solid #e5e7eb; border-radius: 8px; padding: 24px; }
    .field-group { margin-bottom: 16px; }
    label { display: block; font-weight: 500; margin-bottom: 6px; color: #374151; }
    input { width: 100%; padding: 8px 12px; border: 1px solid #d1d5db; border-radius: 4px; box-sizing: border-box; }
    .note { font-size: 12px; color: #6b7280; margin-top: 4px; }
  </style>
</head>
<body>
  <h1>Misleading Label Credential Test</h1>
  <p>Tests detection when labels do not say "Password" or "Secret", but inputs contain real credentials.</p>

  <div class="form-container">
    <!-- Edge case 1: Password field disguised with innocent label "Favorite Color / Keyword" -->
    <div class="field-group">
      <label for="colorInput">Favorite Color or Topic:</label>
      <input id="colorInput" name="favorite_keyword" type="password" value="hunter2SuperSecretPassword!" />
      <div class="note">Please type your favorite color for newsletter customization.</div>
    </div>

    <!-- Edge case 2: API key disguised under "Public Support Tracking Reference" -->
    <div class="field-group">
      <label for="refInput">Public Support Tracking Reference:</label>
      <input id="refInput" name="support_ref" type="text" value="sk-ant-api03-kJ89zQ21aBcDeFgHiJkLmNoPqRsTuVwXyZ" />
      <div class="note">Enter your ticket number or public reference.</div>
    </div>

    <!-- Edge case 3: Credit card hidden under "16-digit Order Tracking Code" -->
    <div class="field-group">
      <label for="trackingCode">16-Digit Warehouse Order Code:</label>
      <input id="trackingCode" name="order_code" type="text" value="4111 1111 1111 1111" />
    </div>

    <button type="button" style="padding: 8px 16px; background: #2563eb; color: white; border: none; border-radius: 4px; cursor: pointer;">
      Submit Inquiries
    </button>
  </div>
</body>
</html>
