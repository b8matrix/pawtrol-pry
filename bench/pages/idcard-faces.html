<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Bench - ID Card & Face Images</title>
  <style>
    body { font-family: system-ui, sans-serif; padding: 24px; background: #f1f5f9; }
    .grid { display: flex; gap: 24px; flex-wrap: wrap; }
    .id-badge {
      width: 320px;
      height: 200px;
      background: #ffffff;
      border-radius: 12px;
      border: 1px solid #cbd5e1;
      padding: 16px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
      position: relative;
    }
    .badge-header { font-size: 14px; font-weight: bold; color: #475569; text-transform: uppercase; border-bottom: 2px solid #e2e8f0; padding-bottom: 6px; }
    .badge-body { display: flex; gap: 14px; margin-top: 14px; align-items: center; }
    .avatar-canvas { border-radius: 8px; border: 1px solid #94a3b8; }
    .badge-details h3 { margin: 0 0 4px 0; font-size: 16px; color: #0f172a; }
    .badge-details p { margin: 2px 0; font-size: 12px; color: #64748b; }
    .page-user { margin-top: 30px; background: white; padding: 16px; border-radius: 8px; border: 1px solid #e2e8f0; width: 320px; }
  </style>
</head>
<body>
  <h1>Fake ID Card and Webpage Faces</h1>
  <p>Tests unconditional face blurring over identity card portraits and webpage profile photos.</p>

  <div class="grid">
    <div class="id-badge">
      <div class="badge-header">Corporate Access Pass</div>
      <div class="badge-body">
        <canvas id="idFace" class="avatar-canvas" width="100" height="110"></canvas>
        <div class="badge-details">
          <h3>Rohan Mehta</h3>
          <p>Role: Lead Engineer</p>
          <p>ID: EMP-89421</p>
          <p>Blood Group: O+</p>
        </div>
      </div>
    </div>

    <div class="page-user">
      <h3>Active User Profile</h3>
      <canvas id="profileFace" class="avatar-canvas" width="120" height="120"></canvas>
      <p style="font-weight: 600; margin-top: 8px;">Ananya Verma</p>
    </div>
  </div>

  <script>
    function drawFace(canvasId, skinColor, eyeColor, hairColor) {
      const c = document.getElementById(canvasId);
      const ctx = c.getContext("2d");
      const w = c.width, h = c.height;

      // Background
      ctx.fillStyle = "#e2e8f0";
      ctx.fillRect(0, 0, w, h);

      // Hair background
      ctx.fillStyle = hairColor;
      ctx.beginPath();
      ctx.arc(w / 2, h * 0.45, w * 0.38, 0, Math.PI * 2);
      ctx.fill();

      // Face Oval
      ctx.fillStyle = skinColor;
      ctx.beginPath();
      ctx.ellipse(w / 2, h * 0.52, w * 0.3, h * 0.36, 0, 0, Math.PI * 2);
      ctx.fill();

      // Eyes
      ctx.fillStyle = "#ffffff";
      ctx.beginPath();
      ctx.ellipse(w * 0.38, h * 0.46, w * 0.08, h * 0.06, 0, 0, Math.PI * 2);
      ctx.ellipse(w * 0.62, h * 0.46, w * 0.08, h * 0.06, 0, 0, Math.PI * 2);
      ctx.fill();

      // Irises / Pupils
      ctx.fillStyle = eyeColor;
      ctx.beginPath();
      ctx.arc(w * 0.38, h * 0.46, w * 0.04, 0, Math.PI * 2);
      ctx.arc(w * 0.62, h * 0.46, w * 0.04, 0, Math.PI * 2);
      ctx.fill();

      // Eyebrows
      ctx.strokeStyle = hairColor;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(w * 0.3, h * 0.38);
      ctx.lineTo(w * 0.45, h * 0.38);
      ctx.moveTo(w * 0.55, h * 0.38);
      ctx.lineTo(w * 0.7, h * 0.38);
      ctx.stroke();

      // Nose
      ctx.strokeStyle = "#c2410c";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(w / 2, h * 0.48);
      ctx.lineTo(w * 0.47, h * 0.58);
      ctx.lineTo(w * 0.53, h * 0.58);
      ctx.stroke();

      // Mouth
      ctx.strokeStyle = "#991b1b";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(w / 2, h * 0.64, w * 0.14, 0.15 * Math.PI, 0.85 * Math.PI, false);
      ctx.stroke();
    }

    // Draw faces with realistic skin tones
    drawFace("idFace", "#f5d0b5", "#1e293b", "#1c1917");
    drawFace("profileFace", "#e6be98", "#334155", "#451a03");
  </script>
</body>
</html>
