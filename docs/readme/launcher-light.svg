<text x="388" y="187" text-anchor="middle" class="lbl" style="fill:#3f3f46">Thu 2</text><rect x="440" y="156" width="80" height="52" rx="6" fill="#ffffff" stroke="#d9d9de"/>

<text x="480" y="187" text-anchor="middle" class="lbl" style="fill:#3f3f46">Fri 3</text>
<rect x="72" y="232" width="104" height="34" rx="17" fill="#ffffff" stroke="#d9d9de"/>
