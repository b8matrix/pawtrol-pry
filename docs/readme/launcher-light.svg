<text x="562" y="242" class="body" style="font-size:11.5px;fill:#6b6b74">Pawtrol takes control of this tab.</text>
<text x="562" y="258" class="body" style="font-size:11.5px;fill:#6b6b74">Personal data is redacted on your device first.</text></g>
<g class="s0"><rect x="562" y="182" width="312" height="44" rx="4" fill="#f4f4f5"/>
<text x="574" y="209" class="mono" style="font-size:12.5px">Read the page</text>
<rect x="802" y="286" width="72" height="32" rx="4" fill="#ffffff" stroke="#d9d9de"/><text x="821" y="307" class="lbl" style="fill:#b0442a">Stop</text></g><g class="s1"><rect x="562" y="182" width="312" height="44" rx="4" fill="#f4f4f5"/>
<text x="574" y="209" class="mono" style="font-size:12.5px">Click Monday 29</text>
<rect x="802" y="286" width="72" height="32" rx="4" fill="#ffffff" stroke="#d9d9de"/><text x="821" y="307" class="lbl" style="fill:#b0442a">Stop</text></g><g class="s2"><rect x="562" y="182" width="312" height="44" rx="4" fill="#f4f4f5"/>
<text x="574" y="209" class="mono" style="font-size:12.5px">Click 9:30 AM</text>
<rect x="802" y="286" width="72" height="32" rx="4" fill="#ffffff" stroke="#d9d9de"/><text x="821" y="307" class="lbl" style="fill:#b0442a">Stop</text></g>
<g class="confirm"><rect x="562" y="182" width="312" height="44" rx="4" fill="#f4f4f5"/>
<text x="574" y="209" class="body" style="font-size:12.5px;fill:#09090b">Allow this? Confirm the booking</text>
<rect x="718" y="286" width="72" height="32" rx="4" fill="#ffffff" stroke="#d9d9de"/><text x="736" y="307" class="lbl" style="fill:#b0442a">Deny</text>
<rect x="802" y="286" width="72" height="32" rx="4" fill="#4a6f9a"/><text x="820" y="307" class="lbl" style="fill:#ffffff">Allow</text></g>
<g class="answer"><rect x="562" y="182" width="312" height="44" rx="4" fill="#f4f4f5"/>
<text x="574" y="209" class="body" style="font-size:12.5px;fill:#09090b">Done: booked Monday 29 at 9:30 AM.</text>
<rect x="788" y="286" width="86" height="32" rx="4" fill="#ffffff" stroke="#d9d9de"/><text x="800" y="307" class="lbl" style="fill:#09090b">New task</text></g>
</g>
