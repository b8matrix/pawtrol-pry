<text x="124" y="254" text-anchor="middle" class="mono" style="font-size:12px;fill:#3f3f46">9:30 AM</text><rect x="188" y="232" width="104" height="34" rx="17" fill="#ffffff" stroke="#d9d9de"/>

<text x="240" y="254" text-anchor="middle" class="mono" style="font-size:12px;fill:#3f3f46">11:00 AM</text><rect x="304" y="232" width="104" height="34" rx="17" fill="#ffffff" stroke="#d9d9de"/>

<text x="356" y="254" text-anchor="middle" class="mono" style="font-size:12px;fill:#3f3f46">2:15 PM</text><rect x="420" y="232" width="104" height="34" rx="17" fill="#ffffff" stroke="#d9d9de"/>

<text x="472" y="254" text-anchor="middle" class="mono" style="font-size:12px;fill:#3f3f46">4:00 PM</text>
<g class="booked"><rect x="72" y="290" width="236" height="30" rx="4" fill="#e9f4ee" stroke="#bfdcca"/><path d="M84 305l3 3 6-7" fill="none" stroke="#2f6f4f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="102" y="310" class="body" style="font-size:12.5px;fill:#2f6f4f">Booked: Monday 29, 9:30 AM</text></g>
<g class="card" filter="url(#soft)"><rect x="548" y="138" width="340" height="196" rx="6" fill="#ffffff" stroke="#d9d9de"/></g>
<g class="card">
<text x="562" y="164" class="lbl">Pawtrol · this tab</text>
