<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 960 440" width="960" height="440" role="img" aria-labelledby="title desc">
<title id="title">The page launcher</title>
<desc id="desc">A floating paw button on a booking page opens a card. The user types 'Book the earliest slot on Monday'; the agent reads the page, clicks Monday, clicks 9:30 AM, asks the user to allow the booking, and reports it done.</desc>
<defs>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="none" stroke-width="1"/></pattern>
  <linearGradient id="gridFade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="1"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <mask id="gridMask"><rect width="960" height="440" fill="url(#gridFade)"/></mask>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.08"/></filter>
  <filter id="blur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="6"/></filter>
</defs>
<style>
.lbl{font-family:'Barlow Condensed','Avenir Next Condensed','Roboto Condensed','Arial Narrow','Helvetica Neue',Arial,sans-serif;font-weight:700;font-size:11px;letter-spacing:.14em;text-transform:uppercase;fill:#6b6b74}
.body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif;font-size:14px;fill:#3f3f46}
.title{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif;font-size:20px;font-weight:600;fill:#09090b}
.mono{font-family:ui-monospace,SFMono-Regular,'SF Mono','JetBrains Mono','Cascadia Mono',Menlo,Consolas,monospace;font-size:13px;fill:#09090b}
@keyframes cursor{0%{transform:translate(460px,240px);opacity:0}2%{transform:translate(460px,240px);opacity:1}9%{transform:translate(872px,354px);opacity:1}50%{transform:translate(872px,354px);opacity:1}56%{transform:translate(832px,300px);opacity:1}62%{transform:translate(832px,300px);opacity:1}70%{transform:translate(892px,360px);opacity:0}100%{transform:translate(892px,360px);opacity:0}}.cursor{animation:cursor 15s infinite}@keyframes ripple{0%{opacity:0;transform:scale(.4)}9.5%{opacity:0;transform:scale(.4)}10%{opacity:.6;transform:scale(.4)}13%{opacity:0;transform:scale(1.4)}100%{opacity:0;transform:scale(1.4)}}.ripple{transform-box:fill-box;transform-origin:center;animation:ripple 15s infinite}@keyframes ripple2{0%{opacity:0;transform:scale(.4)}60.5%{opacity:0;transform:scale(.4)}61%{opacity:.6;transform:scale(.4)}64%{opacity:0;transform:scale(1.4)}100%{opacity:0;transform:scale(1.4)}}.ripple2{transform-box:fill-box;transform-origin:center;animation:ripple2 15s infinite}@keyframes card{0%{opacity:0}10.99%{opacity:0}13%{opacity:1}94%{opacity:1}96%{opacity:0}100%{opacity:0}}.card{animation:card 15s infinite}@keyframes form{0%{opacity:0}10.99%{opacity:0}12%{opacity:1}30%{opacity:1}31%{opacity:0}100%{opacity:0}}.form{animation:form 15s infinite}@keyframes type{0%{transform:scaleX(0)}13%{transform:scaleX(0)}27%{transform:scaleX(1)}94%{transform:scaleX(1)}96%{transform:scaleX(0)}100%{transform:scaleX(0)}}.type{transform-box:fill-box;transform-origin:left center;animation:type 15s steps(31,end) infinite}@keyframes s0{0%{opacity:0}31.99%{opacity:0}32.5%{opacity:1}38%{opacity:1}38.5%{opacity:0}100%{opacity:0}}.s0{animation:s0 15s infinite}@keyframes s1{0%{opacity:0}37.99%{opacity:0}38.5%{opacity:1}44%{opacity:1}44.5%{opacity:0}100%{opacity:0}}.s1{animation:s1 15s infinite}@keyframes s2{0%{opacity:0}43.99%{opacity:0}44.5%{opacity:1}50%{opacity:1}50.5%{opacity:0}100%{opacity:0}}.s2{animation:s2 15s infinite}@keyframes confirm{0%{opacity:0}49.99%{opacity:0}50.5%{opacity:1}62%{opacity:1}62.5%{opacity:0}100%{opacity:0}}.confirm{animation:confirm 15s infinite}@keyframes answer{0%{opacity:0}62.99%{opacity:0}65%{opacity:1}94%{opacity:1}96%{opacity:0}100%{opacity:0}}.answer{animation:answer 15s infinite}@keyframes mon{0%{opacity:0}39.99%{opacity:0}41%{opacity:1}94%{opacity:1}95%{opacity:0}100%{opacity:0}}.mon{animation:mon 15s infinite}@keyframes slot{0%{opacity:0}45.99%{opacity:0}47%{opacity:1}94%{opacity:1}95%{opacity:0}100%{opacity:0}}.slot{animation:slot 15s infinite}@keyframes booked{0%{opacity:0}62.99%{opacity:0}64%{opacity:1}94%{opacity:1}95%{opacity:0}100%{opacity:0}}.booked{animation:booked 15s infinite}@keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}@keyframes busy{0%{opacity:0}30.99%{opacity:0}31.5%{opacity:1}63%{opacity:1}63.5%{opacity:0}100%{opacity:0}}.busy{animation:busy 15s infinite}.spinner{transform-box:fill-box;transform-origin:center;animation:spin 1s linear infinite}
</style>
<rect x="0.5" y="0.5" width="959" height="439" rx="10" fill="#ffffff" stroke="#d9d9de"/>

