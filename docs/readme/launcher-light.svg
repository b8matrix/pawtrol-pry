<path d="M40 70H920" stroke="#ececef"/>
<circle cx="56" cy="55" r="4" fill="#d9d9de"/><circle cx="70" cy="55" r="4" fill="#d9d9de"/><circle cx="84" cy="55" r="4" fill="#d9d9de"/>
<rect x="100" y="47" width="804" height="16" rx="8" fill="#f4f4f5"/>
<text x="112" y="59" class="mono" style="font-size:10.5px;fill:#6b6b74">clinic.example.in/appointments</text>

<text x="72" y="112" class="title" style="font-size:18px">Book an appointment</text>
<text x="72" y="134" class="body" style="font-size:12.5px">Choose a day, then a time.</text>
<rect x="72" y="156" width="80" height="52" rx="6" fill="#ffffff" stroke="#d9d9de"/>
<rect class="mon" x="72" y="156" width="80" height="52" rx="6" fill="#eef3f9" stroke="#4a6f9a"/>
