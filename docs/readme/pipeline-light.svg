<rect x="0.5" y="0.5" width="959" height="371" rx="10" fill="#ffffff" stroke="#d9d9de"/>

<path d="M8 14H20M14 8V20" stroke="#a1a1aa" stroke-width="1"/><path d="M940 14H952M946 8V20" stroke="#a1a1aa" stroke-width="1"/><path d="M8 358H20M14 352V364" stroke="#a1a1aa" stroke-width="1"/><path d="M940 358H952M946 352V364" stroke="#a1a1aa" stroke-width="1"/>

<text x="40" y="48" class="lbl">Every step, every time</text>
<text x="40" y="78" class="title">Six checks run on the device before anything reaches a model.</text>
<rect x="24" y="108" width="140" height="104" rx="6" fill="#fafafa" stroke="#d9d9de"/>
<g class="c0"><rect x="24" y="108" width="140" height="104" rx="6" fill="#eef3f9" stroke="#4a6f9a"/></g>
<text x="38" y="134" class="mono" style="font-size:11px;fill:#6b6b74">01</text>
<text x="38" y="158" class="lbl" style="font-size:13px;fill:#09090b">Detect</text>
<text x="38" y="180" class="body" style="font-size:11.5px">DOM, patterns,</text>
<text x="38" y="196" class="body" style="font-size:11.5px">checksums</text><rect x="180" y="108" width="140" height="104" rx="6" fill="#fafafa" stroke="#d9d9de"/>
<g class="c1"><rect x="180" y="108" width="140" height="104" rx="6" fill="#eef3f9" stroke="#4a6f9a"/></g>
<text x="194" y="134" class="mono" style="font-size:11px;fill:#6b6b74">02</text>
<text x="194" y="158" class="lbl" style="font-size:13px;fill:#09090b">Tokenize</text>
<text x="194" y="180" class="body" style="font-size:11.5px">values become</text>
<text x="194" y="196" class="body" style="font-size:11.5px">&lt;ID_1&gt;, &lt;CARD_1&gt;</text><rect x="336" y="108" width="140" height="104" rx="6" fill="#fafafa" stroke="#d9d9de"/>
<g class="c2"><rect x="336" y="108" width="140" height="104" rx="6" fill="#eef3f9" stroke="#4a6f9a"/></g>
<text x="350" y="134" class="mono" style="font-size:11px;fill:#6b6b74">03</text>
<text x="350" y="158" class="lbl" style="font-size:13px;fill:#09090b">Redact</text>
<text x="350" y="180" class="body" style="font-size:11.5px">anything left over</text>
<text x="350" y="196" class="body" style="font-size:11.5px">becomes [REDACTED]</text><rect x="492" y="108" width="140" height="104" rx="6" fill="#fafafa" stroke="#d9d9de"/>
<g class="c3"><rect x="492" y="108" width="140" height="104" rx="6" fill="#eef3f9" stroke="#4a6f9a"/></g>
<text x="506" y="134" class="mono" style="font-size:11px;fill:#6b6b74">04</text>
<text x="506" y="158" class="lbl" style="font-size:13px;fill:#09090b">Mask pixels</text>
<text x="506" y="180" class="body" style="font-size:11.5px">OCR text and faces</text>
<text x="506" y="196" class="body" style="font-size:11.5px">on the screenshot</text><rect x="648" y="108" width="140" height="104" rx="6" fill="#fafafa" stroke="#d9d9de"/>
<g class="c4"><rect x="648" y="108" width="140" height="104" rx="6" fill="#eef3f9" stroke="#4a6f9a"/></g>
<text x="662" y="134" class="mono" style="font-size:11px;fill:#6b6b74">05</text>
<text x="662" y="158" class="lbl" style="font-size:13px;fill:#09090b">Verify</text>
<text x="662" y="180" class="body" style="font-size:11.5px">re-read every mask</text>
<text x="662" y="196" class="body" style="font-size:11.5px">with OCR</text><rect x="804" y="108" width="140" height="104" rx="6" fill="#fafafa" stroke="#d9d9de"/>
<g class="c5"><rect x="804" y="108" width="140" height="104" rx="6" fill="#eef3f9" stroke="#4a6f9a"/></g>
<text x="818" y="134" class="mono" style="font-size:11px;fill:#6b6b74">06</text>
<text x="818" y="158" class="lbl" style="font-size:13px;fill:#09090b">Send gate</text>
<text x="818" y="180" class="body" style="font-size:11.5px">only verified</text>
<text x="818" y="196" class="body" style="font-size:11.5px">data may leave</text>
<g class="vfail"><rect x="648" y="108" width="140" height="104" rx="6" fill="#fcefea" stroke="#b0442a"/>
<text x="662" y="134" class="mono" style="font-size:11px;fill:#b0442a">05</text>
<text x="662" y="158" class="lbl" style="font-size:13px;fill:#b0442a">Verify failed</text>
<text x="662" y="180" class="body" style="font-size:11.5px;fill:#b0442a">a mask could</text>
<text x="662" y="196" class="body" style="font-size:11.5px;fill:#b0442a">still be read</text></g>
<path d="M94 246H874" stroke="#d9d9de" stroke-dasharray="2 5"/>
<circle cx="94" cy="246" r="3" fill="#d9d9de"/><circle cx="250" cy="246" r="3" fill="#d9d9de"/><circle cx="406" cy="246" r="3" fill="#d9d9de"/><circle cx="562" cy="246" r="3" fill="#d9d9de"/><circle cx="718" cy="246" r="3" fill="#d9d9de"/><circle cx="874" cy="246" r="3" fill="#d9d9de"/>
<g class="dot"><circle cx="94" cy="246" r="7" fill="#4a6f9a" opacity="0.25"/><circle cx="94" cy="246" r="4" fill="#4a6f9a"/></g>
<g class="sent"><rect x="757.36" y="268" width="178.64" height="26" rx="4" fill="#e9f4ee" stroke="#bfdcca"/><path d="M769.36 281l3 3 6-7" fill="none" stroke="#2f6f4f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="787.36" y="285" class="lbl" style="fill:#2f6f4f">Sent to the model</text></g>
<g class="blocked"><rect x="597" y="268" width="242" height="26" rx="4" fill="#fcefea" stroke="#efc9bd"/><path d="M609 277l7 7M616 277l-7 7" fill="none" stroke="#b0442a" stroke-width="1.8" stroke-linecap="round"/><text x="627" y="285" class="lbl" style="fill:#b0442a">Nothing sent. Fail closed</text></g>
<text x="40" y="335" class="lbl">Privacy ledger</text>
<text x="40" y="351" class="lbl" style="font-size:9px">SHA-256 chain · counts only</text>
<g class="l0"><rect x="192" y="321" width="20" height="20" rx="3" fill="#f4f4f5" stroke="#c5d4e5"/></g><g class="l1"><path d="M216 331H242" stroke="#d9d9de"/><rect x="242" y="321" width="20" height="20" rx="3" fill="#f4f4f5" stroke="#c5d4e5"/></g><g class="l2"><path d="M266 331H292" stroke="#d9d9de"/><rect x="292" y="321" width="20" height="20" rx="3" fill="#f4f4f5" stroke="#c5d4e5"/></g><g class="l3"><path d="M316 331H342" stroke="#d9d9de"/><rect x="342" y="321" width="20" height="20" rx="3" fill="#f4f4f5" stroke="#c5d4e5"/></g><g class="l4"><path d="M366 331H392" stroke="#d9d9de"/><rect x="392" y="321" width="20" height="20" rx="3" fill="#f4f4f5" stroke="#c5d4e5"/></g><g class="l5"><path d="M416 331H442" stroke="#d9d9de"/><rect x="442" y="321" width="20" height="20" rx="3" fill="#f4f4f5" stroke="#c5d4e5"/></g><g class="l6"><path d="M466 331H492" stroke="#d9d9de"/><rect x="492" y="321" width="20" height="20" rx="3" fill="#e9f4ee" stroke="#2f6f4f"/></g><g class="l7"><path d="M516 331H542" stroke="#d9d9de"/><rect x="542" y="321" width="20" height="20" rx="3" fill="#f4f4f5" stroke="#c5d4e5"/></g><g class="l8"><path d="M566 331H592" stroke="#d9d9de"/><rect x="592" y="321" width="20" height="20" rx="3" fill="#f4f4f5" stroke="#c5d4e5"/></g><g class="l9"><path d="M616 331H642" stroke="#d9d9de"/><rect x="642" y="321" width="20" height="20" rx="3" fill="#f4f4f5" stroke="#c5d4e5"/></g><g class="l10"><path d="M666 331H692" stroke="#d9d9de"/><rect x="692" y="321" width="20" height="20" rx="3" fill="#f4f4f5" stroke="#c5d4e5"/></g><g class="l11"><path d="M716 331H742" stroke="#d9d9de"/><rect x="742" y="321" width="20" height="20" rx="3" fill="#f4f4f5" stroke="#c5d4e5"/></g><g class="l12"><path d="M766 331H792" stroke="#d9d9de"/><rect x="792" y="321" width="20" height="20" rx="3" fill="#fcefea" stroke="#b0442a"/></g>
</svg>
