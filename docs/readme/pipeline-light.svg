624px,0px);opacity:1}83%{transform:translate(624px,34px);opacity:1}95%{transform:translate(624px,34px);opacity:0}100%{transform:translate(0px,0px);opacity:0}}.dot{animation:dot 16s infinite}@keyframes sent{0%{opacity:0}41.99%{opacity:0}43%{opacity:1}48%{opacity:1}49%{opacity:0}100%{opacity:0}}.sent{animation:sent 16s infinite}@keyframes blocked{0%{opacity:0}82.99%{opacity:0}84%{opacity:1}96%{opacity:1}97%{opacity:0}100%{opacity:0}}.blocked{animation:blocked 16s infinite}@keyframes l0{0%{opacity:0}3.99%{opacity:0}5%{opacity:1}96%{opacity:1}97%{opacity:0}100%{opacity:0}}.l0{animation:l0 16s infinite}@keyframes l1{0%{opacity:0}9.99%{opacity:0}11%{opacity:1}96%{opacity:1}97%{opacity:0}100%{opacity:0}}.l1{animation:l1 16s infinite}@keyframes l2{0%{opacity:0}15.99%{opacity:0}17%{opacity:1}96%{opacity:1}97%{opacity:0}100%{opacity:0}}.l2{animation:l2 16s infinite}@keyframes l3{0%{opacity:0}21.99%{opacity:0}23%{opacity:1}96%{opacity:1}97%{opacity:0}100%{opacity:0}}.l3{animation:l3 16s infinite}@keyframes l4{0%{opacity:0}27.99%{opacity:0}29%{opacity:1}96%{opacity:1}97%{opacity:0}100%{opacity:0}}.l4{animation:l4 16s infinite}@keyframes l5{0%{opacity:0}33.99%{opacity:0}35%{opacity:1}96%{opacity:1}97%{opacity:0}100%{opacity:0}}.l5{animation:l5 16s infinite}@keyframes l6{0%{opacity:0}41.99%{opacity:0}43%{opacity:1}96%{opacity:1}97%{opacity:0}100%{opacity:0}}.l6{animation:l6 16s infinite}@keyframes l7{0%{opacity:0}53.99%{opacity:0}55%{opacity:1}96%{opacity:1}97%{opacity:0}100%{opacity:0}}.l7{animation:l7 16s infinite}@keyframes l8{0%{opacity:0}59.99%{opacity:0}61%{opacity:1}96%{opacity:1}97%{opacity:0}100%{opacity:0}}.l8{animation:l8 16s infinite}@keyframes l9{0%{opacity:0}65.99%{opacity:0}67%{opacity:1}96%{opacity:1}97%{opacity:0}100%{opacity:0}}.l9{animation:l9 16s infinite}@keyframes l10{0%{opacity:0}71.99%{opacity:0}73%{opacity:1}96%{opacity:1}97%{opacity:0}100%{opacity:0}}.l10{animation:l10 16s infinite}@keyframes l11{0%{opacity:0}77.99%{opacity:0}79%{opacity:1}96%{opacity:1}97%{opacity:0}100%{opacity:0}}.l11{animation:l11 16s infinite}@keyframes l12{0%{opacity:0}82.99%{opacity:0}84%{opacity:1}96%{opacity:1}97%{opacity:0}100%{opacity:0}}.l12{animation:l12 16s infinite}
