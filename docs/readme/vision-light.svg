<text x="156" y="199" class="lbl" style="font-size:10px">Government of India</text>
<text x="156" y="228" class="body" style="font-size:15px;fill:#09090b;font-weight:600">Priya Sharma</text>
<text x="156" y="252" class="body" style="font-size:11px">Aadhaar</text>
<text x="156" y="295" class="mono" style="font-size:19px;letter-spacing:.04em">2345 6789 0124</text>
