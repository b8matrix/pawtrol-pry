<path d="M40 130H510" stroke="#ececef"/>
<circle cx="56" cy="115" r="4" fill="#d9d9de"/><circle cx="70" cy="115" r="4" fill="#d9d9de"/><circle cx="84" cy="115" r="4" fill="#d9d9de"/>
<rect x="100" y="107" width="394" height="16" rx="8" fill="#f4f4f5"/>
<text x="112" y="119" class="mono" style="font-size:10.5px;fill:#6b6b74">kyc.example.in/upload</text>
<text x="64" y="158" class="body" style="fill:#09090b;font-weight:600">Uploaded ID card</text>
