tion:g3 13s infinite}@keyframes g4{0%{opacity:0}37.99%{opacity:0}39%{opacity:1}92%{opacity:1}93%{opacity:0}100%{opacity:0}}.g4{animation:g4 13s infinite}@keyframes g5{0%{opacity:0}43.99%{opacity:0}45%{opacity:1}92%{opacity:1}93%{opacity:0}100%{opacity:0}}.g5{animation:g5 13s infinite}@keyframes g6{0%{opacity:0}51.99%{opacity:0}53%{opacity:1}92%{opacity:1}93%{opacity:0}100%{opacity:0}}.g6{animation:g6 13s infinite}@keyframes g7{0%{opacity:0}57.99%{opacity:0}59%{opacity:1}92%{opacity:1}93%{opacity:0}100%{opacity:0}}.g7{animation:g7 13s infinite}
</style>
